# An agent whose tool is a statechart. The chart sends the agent an event,
# which the agent receives and ignores, then waits on a key.
agent: asker
model: { name: scripted, service: anthropic }
turn: ./turn.js
prompt: Ask a person about the disk.
tools:
  ask_person:
    does: Ask a person and wait for the answer
    args: { topic: string }
    job: { machine: ./child.yaml, input: { topic: "${args.topic}" } }
