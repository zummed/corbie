# Nested states. inner's job fails; inner has no rule for failed, so the
# failure goes up to outer's. Then a final state inside second_outer
# finishes it, and its rule for done sees that final state's output.
statechart: nested
initial: outer
states:
  outer:
    on: { failed: second_outer }
    initial: inner
    states:
      inner:
        job: { script: ./fail.js }
        on: { done: unreachable }
      unreachable:
        end: done
  second_outer:
    initial: step_one
    on: { done: finished }
    states:
      step_one:
        job: { script: ./echo.js, input: { error_seen: "${event.data.error}" } }
        on: { done: inner_final }
      inner_final:
        end: done
        output: { from_inner_final: "${states.step_one.output.error_seen}" }
  finished:
    end: done
    output:
      came_by: ${event.name}
      got: ${event.data}
