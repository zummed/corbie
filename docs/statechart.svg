    <radialGradient id="g1" cx="0.5" cy="0.5" r=".42"><stop offset="0" stop-color="#5FC0CF" stop-opacity=".22"/><stop offset="1" stop-color="#5FC0CF" stop-opacity="0"/></radialGradient>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><line x1="0" y1="0" x2="0" y2="9" stroke="#fff" stroke-opacity=".03"/></pattern>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="92.13333333333334" y1="0" x2="223.86666666666667" y2="0"><stop offset="0" stop-color="#3AA9BC"/><stop offset=".55" stop-color="#6593E0"/><stop offset="1" stop-color="#A283E2"/></linearGradient>
    <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A3AFB2"/></marker>
    <clipPath id="win"><rect x="8" y="56" width="300" height="156"/></clipPath>
  </defs>
