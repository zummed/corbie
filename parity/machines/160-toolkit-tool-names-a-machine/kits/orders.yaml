toolkit: orders
description: The orders app.
input: { team: string }
hooks:
  team:
    when: "${job.approve}"
    before: { script: yes.js, input: { tool: "${job.tool}", meta: "${job.meta}" } }
tools:
  read_file: { call: files/read, input: { project: "${input.team}/orders" } }
  change_file:
    machine: ./change.yaml
    input: { project: "${input.team}/orders" }
    approve: true
    meta: { channel: "#orders-team" }
