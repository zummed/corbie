# The parent sends its child one event, poke. The child is in a state with
# two named jobs, and the rule for poke on that state stays and sends poked
# back. The parent has no rule for poked: how many arrive is read from its
# record. After a second the parent tells the child to finish.
statechart: parent
initial: running
states:
  running:
    job: { machine: ./child.yaml }
    on:
      ready: { send: { to: running, event: poke } }
    after:
      1s: { send: { to: running, event: finish } }
    done: finished
  finished:
    final: true
    output: ${event.data}
