# The called run fails: the call job fails with its error, and a stage that
# reads the failure runs.
flow: caller
allow: [send:lookup]
stages:
  look: { job: { call: { at: lookup }, input: { n: 1 } } }
  after: { when: "${stages.look.failed}", job: { script: ./said.js, input: { error: "${stages.look.error}" } } }
output: ${stages.after.output}
