# An agent whose tool is another agent. The sub-agent's result is the
# tool's result as the lead's model is shown it.
agent: lead
model: { name: scripted, service: anthropic }
turn: ./turn-lead.js
prompt: Ask the helper.
tools:
  helper:
    does: Have the helper add one
    args: { n: number }
    job: { machine: ./helper.yaml, input: { n: "${args.n}" } }
