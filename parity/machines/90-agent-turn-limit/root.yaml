# An agent allowed two turns, with a scripted model that wants four, fails
# at its limit. Its error carries the conversation, and a second run of the
# same agent started with that conversation carries on and finishes.
flow: parent
stages:
  first:
    job: { machine: ./agent.yaml, input: {} }
  carry_on:
    when: ${stages.first.failed}
    job: { machine: ./agent.yaml, input: { conversation: "${stages.first.output.conversation}" } }
output:
  first_error: ${stages.first.error}
  reply: ${stages.carry_on.output.reply}
