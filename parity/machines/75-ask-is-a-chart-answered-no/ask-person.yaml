# ask-person.yaml: an ask that waits for a person. It hands out the ticket
# decision and ends with what the answer says.
statechart: ask-person
input: [asking, jobs]
initial: asking
states:
  asking:
    ticket: decision
    on: { decision: decided }
  decided:
    end: done
    output:
      approve: "${event.data.yes ? input.jobs.map(r => r.name) : []}"
      note: ${event.data.note}
