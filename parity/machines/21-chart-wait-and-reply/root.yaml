# A state nested inside another waits on a ticket; the handler for the reply
# is on the outer state, so the reply goes up to it. A client replies three
# times: see drive.md.
statechart: wait-and-reply
initial: talking
states:
  talking:
    on: { answer: answered }
    initial: asking
    states:
      asking:
        ticket: answer
  answered:
    job: { script: ./echo.js, input: { said: "${event.data.said}", came_by: "${event.name}" } }
    on: { done: finished }
  finished:
    end: done
    output: ${states.answered.output}
