# The parent chart sends an event to its flow child (from a timer, a second
# in), and has a rule for item on the state that runs it. The flow has a
# stage that emits values named item and a stage that takes two seconds.
statechart: parent
initial: running
states:
  running:
    job: { machine: ./child.yaml }
    timers: { poke: 1s }
    on:
      done: finished
      item: saw_emit
      poke: { send: { to: running, event: poke, data: { from: parent } } }
  saw_emit:
    end: done
    output: { parent_saw_emit: true }
  finished:
    end: done
    output: { parent_saw_emit: false, child: "${event.data}" }
