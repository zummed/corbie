# The same failure, but the only stage that looks at it reads
# stages.bad.error and not stages.bad.failed.
flow: reads-error-only
stages:
  bad:
    job: { script: ./fail.js }
  reads_error_only:
    job: { script: ./echo.js, input: { error: "${stages.bad.error}" } }
output:
  seen: ${stages.reads_error_only.output}
