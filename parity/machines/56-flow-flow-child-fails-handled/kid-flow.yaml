# kid-flow.yaml: a child flow of two stages. It fails in its second stage
# when its input says fail.
flow: kid-flow
input: { n: any }
stages:
  one:
    job: { script: ./add.js, input: { n: "${input.n}" } }
  two:
    job: { script: ./maybe.js, input: { n: "${stages.one.output.n}", fail: "${input.fail}" } }
output:
  n: ${stages.two.output.n}
  input_seen: ${input}
