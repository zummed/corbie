# The root's hooks run for the jobs of the machines below it: an agent it
# names, and a machine a script made while running.
flow: root
approve: [exec]
hooks:
  mask:
    after: { script: ./mask.js, input: { text: "${output}" } }
    when: "${job.tool}"
  exec:
    before: { script: ./no-deploy.js }
    when: "${job.approve}"
stages:
  read:
    job: { machine: ./reader.yaml }
  plan:
    job: { script: ./plan.js }
  made:
    job: { machine: "${stages.plan.output}", allow: [exec] }
output: { read: "${stages.read.output.reply}", made: "${stages.made.output}" }
