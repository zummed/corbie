# A flow stage runs a chart that waits on a key. A client replies to the
# child's instance; the child's output is the stage's.
flow: parent
stages:
  question:
    job: { machine: ./child.yaml, input: { topic: disk } }
  use:
    job: { script: ./echo.js, input: { said: "${stages.question.output.said}" } }
output:
  use: ${stages.use.output}
