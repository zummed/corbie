# Chart, agent, chart. The root's timer leaves the state that runs the
# agent, a second in, while the agent's tool, a chart, is running.
statechart: top
initial: running
states:
  running:
    job: { machine: ./agent.yaml }
    timers: { leave: 1s }
    on:
      done: too_late
      leave: finished
  too_late:
    end: done
    output: { agent_finished: true }
  finished:
    end: done
    output: { left_by: "${event.name}" }
