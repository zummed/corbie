# Three statecharts deep, each waiting. After a second the root's timer
# leaves the state that runs the middle chart.
statechart: top
initial: running
states:
  running:
    job: { machine: ./middle.yaml }
    timers: { leave: 1s }
    on: { leave: finished }
  finished:
    end: done
    output: { left_by: "${event.name}" }
