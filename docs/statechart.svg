    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5FC0CF"/><stop offset=".5" stop-color="#84ACE2"/><stop offset="1" stop-color="#BBA0E6"/></linearGradient>
