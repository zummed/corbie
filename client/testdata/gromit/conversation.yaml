# One run per thread. Each message is a turn: the lookup gives the asker's
# scopes, the agent answers with the toolkits they allow, and the reply is
# posted in the thread. A reaction in the thread keeps the run a while longer.
# A run with nothing for a day ends.
statechart: conversation
description: Answers one Slack thread with the agent at agents/support.
lifetime: keyed
receive: [gromit/slack/gromit]
initial: idle
states:
  idle:
    timers: { quiet: 1d }
    on: { message: answering, seen: idle, quiet: over }
  answering:
    defer: [message]
    job:
      input: { message: "${event.data}" }
      machine:
        flow: turn
        input: { message: any }
        allow: [send:people/find, send:agents/support, send:gromit/slack/chat/post]
        stages:
          asker: { job: { call: { at: people/find }, input: { email: "${input.message.email}" } } }
          answer: { job: { call: { at: agents/support }, input: { message: "${input.message}", asker: "${stages.asker.output}" } } }
          post: { job: { call: { at: gromit/slack/chat/post }, input: { in: "${input.message.chat}", text: "${stages.answer.output.reply}" } } }
        output: ${stages.post.output}
    on: { done: idle, failed: idle }
  over: { end: done }
