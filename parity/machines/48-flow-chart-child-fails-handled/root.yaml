# The chart child ends in a failed final state that has an output:. A
# stage's when: reads stages.kid.failed, which handles it.
flow: parent
stages:
  kid:
    job: { machine: ./kid-chart.yaml, input: { n: 1, fail: true } }
  cleanup:
    when: ${stages.kid.failed}
    job: { script: ./echo.js, input: { error: "${stages.kid.error}", output: "${stages.kid.output}" } }
output:
  cleanup: ${stages.cleanup.output}
  kid_failed: ${stages.kid.failed}
  kid_output: ${stages.kid.output}
