# A flow whose stage runs a chart, which runs a chart that never finishes
# and has a deadline of its own (limits.deadline: 1s). The middle chart's
# failed: takes the timeout and notes what it was given. The flow has no
# deadline.
flow: top
stages:
  mid:
    job: { machine: ./middle.yaml }
output:
  mid: ${stages.mid.output}
