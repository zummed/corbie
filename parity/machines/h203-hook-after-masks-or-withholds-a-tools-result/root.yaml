agent: reader
model: { name: scripted, service: anthropic }
turn: ./turn.js
prompt: Read two pages.
hooks:
  mask:
    after: { script: ./mask.js, input: { text: "${result.output}" } }
    when: "${job.tool && job.tool.name == 'fetch' && result.status == 'done'}"
tools:
  fetch: { description: Fetch a page, args: { url: string }, job: { script: ./fetch.js, input: { url: "${args.url}" } } }
