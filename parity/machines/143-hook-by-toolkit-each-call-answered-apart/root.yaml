agent: helper
model: { name: scripted, service: anthropic }
turn: ./turn.js
prompt: Refund order 7 and tell the team.
hooks:
  orders-team:
    before: { script: ./approver.js, input: { who: orders-team, limit: 100, tool: "${job.tool.name}", args: "${job.tool.args}" } }
    when: "${job.approve && job.tool.toolkit == 'orders'}"
  comms:
    before: { script: ./approver.js, input: { who: comms, tool: "${job.tool.name}", args: "${job.tool.args}" } }
    when: "${job.approve && job.tool.toolkit == 'messages'}"
tools:
  orders: { machine: ./orders.yaml }
  messages: { machine: ./messages.yaml }
