# each: starts three child flows at once; the second fails. The flow's
# output: reads the stage's output, so the parent ends well with
# { item, error } for the second.
flow: parent
stages:
  kids:
    each: [{ n: 1 }, { n: 2, fail: true }, { n: 3 }]
    job: { machine: ./kid-flow.yaml, input: "${item}" }
output:
  kids: ${stages.kids.output}
