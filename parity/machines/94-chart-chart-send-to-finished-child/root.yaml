# A state with no done: stays active after its child has finished. A timer
# then sends the finished child an event, a second in; a second timer
# leaves the state a second later.
statechart: parent
initial: running
states:
  running:
    job: { machine: ./child.yaml }
    after:
      1s: { send: { to: running, event: hello, data: { from: parent } } }
      2s: finished
  finished:
    final: true
    output: { came_by: "${event.name}", child_output: "${states.running.output}" }
