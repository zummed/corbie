agent: support
description: Answers questions in #support and in direct messages.
receive: [conversation]
input: { message: any, asker: any }
model: { name: claude-sonnet-5-5, service: anthropic, secret: ANTHROPIC_KEY }
system: { include: ./support.md }
prompt: ${input.message.text}
toolkits:
  orders: { include: toolkits/orders.yaml, when: "${input.asker.scopes.includes('orders:read')}" }
  infra: { include: toolkits/infra.yaml, when: "${input.asker.scopes.includes('infra:read')}" }
