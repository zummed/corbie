# The child chart waits on a ticket. A client cancels the root. Then it
# replies to the child's ticket. The root's send on leaving is addressed to
# its parent, since one to the state's own child is refused.
statechart: parent
initial: running
states:
  running:
    exit: { send: { to: parent, event: parent_leaving } }
    job: { machine: ./child.yaml }
    on: { done: finished }
  finished:
    end: done
    output: { child: "${event.data}" }
