statechart: child
input: { how: any }
initial: choosing
states:
  choosing:
    job: { script: ./echo.js, input: { how: "${input.how}" } }
    on:
      done:
        - { go: failing_run, when: '${event.data.how == "run"}' }
        - gave_up
  failing_run:
    job: { script: ./fail.js }
  gave_up:
    end: failed
    output: { why: "the child gave up" }
