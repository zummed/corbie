[tools]
go = "1.27.1"

[env]
CGO_ENABLED = "0"

[tasks.build]
description = "Build the corbie binary"
run = "go build -o build/corbie ./cmd/corbie"

[tasks.build-noui]
description = "Build the corbie binary without the UI"
run = "go build -tags noui -o build/corbie ./cmd/corbie"

[tasks.solid]
description = "Replace Solid's files under ui/page with a release's, copied unchanged from npm; SOLID and SOLID_HTML are the versions"
run = """
set -e
solid=${SOLID:-2.0.3} html=${SOLID_HTML:-2.0.1}
tmp=$(mktemp -d)
trap 'rm -r "$tmp"' EXIT
for p in solid-js@$solid @solidjs/signals@$solid @solidjs/web@$solid @solidjs/html@$html; do
  mkdir -p "$tmp/${p%@*}"
  npm pack "$p" --silent --pack-destination "$tmp/${p%@*}" >/dev/null
  tar -xzf "$tmp/${p%@*}"/*.tgz -C "$tmp/${p%@*}"
done
js=$tmp/solid-js/package/dist signals=$tmp/@solidjs/signals/package/dist
web=$tmp/@solidjs/web/package/dist tagged=$tmp/@solidjs/html/package/dist
out=ui/page/assets/solid dev=ui/page/testdata/solid-dev
rm -r $out/signals $dev/signals
cp $js/solid.js $js/internal.js $web/web.js $tagged/html.js $out/
cp -r $signals/prod $out/signals
cp $js/internal.js $tagged/html.js $dev/
cp $js/solid.dev.js $dev/solid.js
cp $web/web.dev.js $dev/web.js
mkdir $dev/signals
cp $signals/dev.js $dev/signals/index.js
cp $signals/dev-shared.js $dev/signals/dev-shared.js
"""

[tasks.dist]
description = "Build the corbie binary for every platform a release carries, into build/dist/; VERSION is the version the binaries print"
run = """
set -e
for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 js/wasm; do
  os=${target%/*} arch=${target#*/} ext=
  if [ "$os" = windows ]; then ext=.exe; fi
  if [ "$os" = js ]; then ext=.wasm; fi
  GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w -X github.com/zummed/corbie/client/cli.Version=${VERSION:-}" -o "build/dist/corbie-$os-$arch$ext" ./cmd/corbie
done
"""

[tasks.site]
description = "Write the manual as the binary serves it into build/site/, as a directory of pages to publish"
run = """
set -e
go build -o build/corbie ./cmd/corbie
rm -rf build/site
build/corbie manual web --listen 127.0.0.1:7404 >/dev/null 2>&1 &
server=$!
trap 'kill $server' EXIT
until wget -q -O /dev/null http://127.0.0.1:7404/; do sleep 0.2; done
wget -q --recursive --level=inf --no-host-directories --adjust-extension --page-requisites \
  -e robots=off --directory-prefix=build/site http://127.0.0.1:7404/
"""

[tasks.test]
description = "Run every package's tests, with Go's checks on unsafe pointers switched on"
run = "go test -gcflags=all=-d=checkptr ./..."

[tasks.vet]
description = "Vet the module"
run = "go vet ./..."

[tasks.check]
description = "Vet and test"
depends = ["vet", "test"]
