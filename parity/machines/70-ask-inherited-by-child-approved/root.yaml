# The root flow has the ask (it approves everything) and marks nothing
# itself. Its two children, a flow and a chart, each mark a job approve:
# true and have no ask: of their own.
flow: parent
ask:
  script: ./yes.js
stages:
  flow_kid:
    job: { machine: ./guarded-flow.yaml, input: { n: 1 } }
  chart_kid:
    job: { machine: ./guarded-chart.yaml, input: { n: 10 } }
output:
  flow_kid: ${stages.flow_kid.output}
  chart_kid: ${stages.chart_kid.output}
