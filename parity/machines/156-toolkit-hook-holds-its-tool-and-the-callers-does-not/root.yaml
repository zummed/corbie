# The toolkit marks its tool's job for approval. The toolkit's own hook
# runs for it, reads the call as job.tool, and says yes. The caller's hook,
# which says no, does not run for it.
flow: caller
allow: [send:notes]
hooks:
  approval: { before: { script: ./no.js }, when: "${job.approve}" }
stages:
  add:
    job:
      call: { at: notes }
      input: { request: { do: call, tool: add_note, args: { text: milk } } }
output: ${stages.add.output}
