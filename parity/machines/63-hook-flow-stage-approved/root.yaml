# A stage marked approve: true and a hook (a script) that says yes to
# everything. The hook runs first; the stage's job starts once it says yes.
flow: asks
hooks:
  approval: { before: { script: ./yes.js }, when: "${job.approve}" }
stages:
  free:
    job: { script: ./add.js, input: { n: 1 } }
  guarded:
    job: { script: ./add.js, input: { n: "${stages.free.output.n}" }, approve: true }
output:
  guarded: ${stages.guarded.output}
