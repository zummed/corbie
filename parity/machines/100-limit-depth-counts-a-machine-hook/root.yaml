# The root sets depth: 0 and starts no children, but its hook is a machine.
flow: asks
limits: { depth: 0 }
hooks:
  approval: { before: { machine: ./ask-person.yaml }, when: "${job.approve}" }
stages:
  guarded:
    job: { script: ./add.js, input: { n: 1 }, approve: true }
  note:
    when: ${stages.guarded.failed}
    job: { script: ./echo.js, input: { error: "${stages.guarded.error}" } }
output:
  note: ${stages.note.output}
