# guarded-chart.yaml: a chart whose one working state is marked for approval.
statechart: guarded-chart
input: [n]
initial: guarded
states:
  guarded:
    job: { script: ./add.js, input: { n: "${input.n}" }, approve: true }
    done: finished
  finished:
    final: true
    output: { n: "${states.guarded.output.n}" }
