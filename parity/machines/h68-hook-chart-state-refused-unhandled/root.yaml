# A statechart state marked approve: true, an ask that approves nothing,
# and no rule for failed.
statechart: asks
hooks:
  approval: { before: { script: ./no.js }, when: "${job.approve}" }
initial: guarded
states:
  guarded:
    job: { script: ./add.js, input: { n: 1 }, approve: true }
    on: { done: finished }
  finished:
    end: done
