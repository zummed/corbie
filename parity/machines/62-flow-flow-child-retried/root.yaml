# A stage that runs a child flow, with restarts. The child fails on the
# first attempt and works on the second, a second later. Each attempt is a
# new instance of the child.
flow: parent
stages:
  kid:
    job:
      machine: ./child.yaml
      input: { ok_after: "${Date.now() + 600}" }
      restart: { limit: 2 }
output:
  kid: ${stages.kid.output}
