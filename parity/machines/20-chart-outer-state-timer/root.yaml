# A timer written on an outer state fires while the chart is in a state
# nested inside it, whose job has already finished.
statechart: outer-timer
initial: outer
states:
  outer:
    timers: { leave: 1s }
    on: { leave: finished }
    initial: inner
    states:
      inner:
        job: { script: ./echo.js, input: { n: 1 } }
  finished:
    end: done
    output: { came_by: "${event.name}", inner: "${states.inner.output}" }
