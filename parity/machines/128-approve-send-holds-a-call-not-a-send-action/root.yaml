# approve: [send:…] marks the chart's call job, which waits for its hook. The send
# action on entering the state is never held.
statechart: caller
allow: ["send:**"]
approve: ["send:**"]
hooks:
  approval: { before: { script: ./yes.js }, when: "${job.approve}" }
initial: calling
states:
  calling:
    entry: { send: { to: { at: room, key: k }, event: hi } }
    job: { call: { at: lookup }, input: { n: 1 } }
    on: { done: over }
  over: { end: done }
