# The child chart waits on a key. A client cancels the root. Then it
# replies to the child's key. The root's send on leaving is addressed to
# its parent, since one to the state's own child is refused.
statechart: parent
initial: running
states:
  running:
    exit: { send: { to: parent, event: parent_leaving } }
    job: { machine: ./child.yaml }
    done: finished
  finished:
    final: true
    output: { child: "${event.data}" }
