statechart: tally
lifetime: singleton
handover: counting
allow: [send:root]
initial: idle
states:
  idle:
    on:
      add: counting
      ask: { send: { to: "${event.from}", event: said, data: "${states.counting.output ?? input}" } }
  counting:
    job: { script: ./count.js, input: "${states.counting.output ?? input}" }
    defer: [add, ask]
    on: { done: idle }
