description: The servers. Their state, and restarting one.
instructions: { include: ./infra.md }
tools:
  vm_status: { call: infra/vms/status }
  restart: { call: infra/vms/restart, approve: true }
  # A tool written as a job runs at the agent's location, where
  # HYPERVISOR_KEY is not set, so console fails; restart calls a machine at
  # infra/vms, where it is set.
  console:
    description: Read the last lines of a virtual machine's console.
    args: { name: string }
    job: { script: ./console.js, input: { name: "${args.name}" }, allow: ["secret:HYPERVISOR_KEY@*"] }
