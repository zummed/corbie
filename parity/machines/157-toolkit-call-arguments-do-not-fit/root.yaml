# A call gives an argument of the wrong type, and one names a tool the
# toolkit does not have. Each run of the toolkit fails, and no job starts.
flow: caller
stages:
  wrong: { job: { machine: ./notes.yaml, input: { request: { do: call, tool: add_note, args: { text: 4 } } } } }
  missing: { job: { machine: ./notes.yaml, input: { request: { do: call, tool: remove_note } } } }
  resume: { job: { machine: ./notes.yaml, input: { request: { do: resume, tool: add_note, state: 1 } } } }
output:
  wrong: ${stages.wrong.error}
  missing: ${stages.missing.error}
  resume: ${stages.resume.error}
