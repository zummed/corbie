statechart: middle
input: { depth: any }
initial: running
states:
  running:
    job: { machine: ./bottom.yaml, input: { depth: "${input.depth + 1}" } }
    on:
      done: finished
      news:
        send: { to: parent, event: relayed, data: { via: middle, news: "${event.data}" } }
      order:
        send: { to: running, event: order, data: { via: middle, order: "${event.data}" } }
  finished:
    end: done
    output: { bottom: "${event.data}" }
