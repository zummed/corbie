# A final state with end: failed, nested one level down, with an
# output:. The chart fails at once, and the output goes with the failure.
statechart: failed-final
initial: outer
states:
  outer:
    on: { done: finished }
    initial: working
    states:
      working:
        job: { script: ./fail.js }
        on: { failed: gave_up }
      gave_up:
        end: failed
        output: { why: "${event.data.error}" }
  finished:
    end: done
    output: { reached: finished }
