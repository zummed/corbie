# The child flow fails; a stage's when: reads stages.kid.failed.
flow: parent
stages:
  kid:
    job: { machine: ./kid-flow.yaml, input: { n: 1, fail: true } }
  cleanup:
    when: ${stages.kid.failed}
    job: { script: ./echo.js, input: { error: "${stages.kid.error}" } }
  needs_kid:
    job: { script: ./echo.js, input: { n: "${stages.kid.output.n}" } }
output:
  cleanup: ${stages.cleanup.output}
  needs_kid_skipped: ${stages.needs_kid.skipped}
