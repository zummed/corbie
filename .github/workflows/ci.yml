name: ci

on:
  push:
    branches: [main]
  pull_request:

# One run at a time for a branch. A run that has started finishes; of the
# pushes that arrive meanwhile, only the newest is run after it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # mise.toml pins Go and holds the tasks, here as on a desk.
      - uses: jdx/mise-action@v5

      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-

      - run: mise run check

      - run: mise run dist

      - run: mise run site

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: site

  # The packages whose code differs on Windows are tested there. The rest
  # of the tests start programs through sh.
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v5

      - run: mise exec -- go test ./store/ ./runner/

  # The manual is published from the newest commit on main that passed.
  pages:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
