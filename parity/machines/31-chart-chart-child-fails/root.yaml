# The child chart fails three ways, and each time the parent's failed:
# takes it and a script notes what the parent was given (the error and the
# output in the failed event's data): a job nothing handles, a final state
# marked failed: true with an output:, and a missing input.
statechart: parent
initial: first
states:
  first:
    job: { machine: ./child.yaml, input: { how: run } }
    failed: note_first
  note_first:
    job: { script: ./echo.js, input: { name: "${event.name}", error: "${event.data.error}", output: "${event.data.output}" } }
    done: second
  second:
    job: { machine: ./child.yaml, input: { how: final } }
    failed: note_second
  note_second:
    job: { script: ./echo.js, input: { name: "${event.name}", error: "${event.data.error}", output: "${event.data.output}" } }
    done: third
  third:
    job: { machine: ./child.yaml }
    failed: note_third
  note_third:
    job: { script: ./echo.js, input: { name: "${event.name}", error: "${event.data.error}", output: "${event.data.output}" } }
    done: finished
  finished:
    final: true
    output:
      first: ${states.note_first.output}
      second: ${states.note_second.output}
      third: ${states.note_third.output}
      remembered_outputs: [ "${states.first.output}", "${states.second.output}", "${states.third.output}" ]
